# Publica uma versão: ao enviar a tag vX.Y.Z, o GitHub gera o instalador e cria
# o Release. Os apps instalados encontram esse Release sozinhos (updater.py).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: A tag tem que bater com version.py
        shell: pwsh
        run: |
          $v = python -c "import version; print(version.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != version.py (v$v)" }

      - name: Dependências
        run: python -m pip install -r requirements.txt

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Python python

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          installer/NitroSwitch-Setup.exe installer/NitroSwitch-Setup.exe.sha256
          --title "NitroSwitch ${{ github.ref_name }}" --generate-notes
